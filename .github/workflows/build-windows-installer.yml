name: Build Windows Setup.exe

on:
  workflow_dispatch:
  push:
    branches: [main, vrstoxeze-nifty-command-desk-effa]
    paths:
      - "backend/**"
      - "frontend/**"
      - "desktop.py"
      - "NiftyAnalyzer.spec"
      - "installer/**"
      - "assets/**"
      - "requirements*.txt"
      - "build_*.ps1"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate icon
        run: python scripts/generate_icon.py
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean NiftyAnalyzer.spec
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile Setup.exe
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after chocolatey install" }
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          & $iscc installer\NiftyAnalyzer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item dist\windows\NiftyAnalyzer-Setup-2.0.0.exe
      - uses: actions/upload-artifact@v4
        with:
          name: NiftyAnalyzer-Setup-2.0.0
          path: dist/windows/NiftyAnalyzer-Setup-2.0.0.exe
          if-no-files-found: error
