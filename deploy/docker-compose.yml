services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nifty-analyzer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nifty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nifty}
      POSTGRES_DB: nifty_desk
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nifty} -d nifty_desk"]
      interval: 10s
      timeout: 5s
      retries: 8

  nifty-analyzer:
    build:
      context: ..
      dockerfile: deploy/nifty/Dockerfile
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      MARKET_DATA_MODE: ${MARKET_DATA_MODE:-live}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nifty}:${POSTGRES_PASSWORD:-nifty}@postgres:5432/nifty_desk
      REDIS_URL: redis://redis:6379/0
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_API_SECRET: ${KITE_API_SECRET:-}
      KITE_ACCESS_TOKEN: ${KITE_ACCESS_TOKEN:-}
      NEWS_ENABLED: ${NEWS_ENABLED:-1}
    volumes:
      - nifty-data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 8

volumes:
  postgres-data:
  nifty-data:
